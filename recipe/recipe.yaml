context:
  version: "3.1.0"

package:
  name: jaq
  version: ${{ version }}

source:
  url: https://github.com/01mf02/jaq/archive/v${{ version }}.tar.gz
  sha256: 8ad074d7e90e07ad7e77048dcf0d0e7ad434b8e3e38044260b9457d4551e644d

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - jaq --help

about:
  license: MIT
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml
  summary: JQ clone focussed on correctness, speed, and simplicity
  homepage: https://github.com/01mf02/jaq
  repository: https://github.com/01mf02/jaq

extra:
  recipe-maintainers:
    - danielnachun
