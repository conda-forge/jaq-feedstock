context:
  version: "3.1.2"

package:
  name: jaq
  version: ${{ version }}

source:
  url: https://github.com/01mf02/jaq/archive/v${{ version }}.tar.gz
  sha256: 54ac66fac30a1d28c54f19716215cf4256877c69964c1c0150c3976bde618b93

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - jaq --help

about:
  license: MIT
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml
  summary: JQ clone focussed on correctness, speed, and simplicity
  homepage: https://github.com/01mf02/jaq
  repository: https://github.com/01mf02/jaq

extra:
  recipe-maintainers:
    - danielnachun
